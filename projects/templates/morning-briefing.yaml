name: morning-briefing
displayName: Morning Briefing
description: Compile and send daily morning briefing

plan:
  approval: auto
  parallel: true

tasks:
  - id: fetch-emails
    type: agent
    title: Fetch recent emails
    agent: gmail
    prompt: "Search for unread emails from the last 12 hours and provide a summary of important messages, including sender, subject, and urgency level."
    blockedBy: []

  - id: fetch-tasks
    type: agent
    title: Fetch current TickTick workload
    agent: ticktick
    prompt: "Inspect the official TickTick schemas. Discover lists with list_projects, query each list with get_project_with_undone_tasks, and separately check Inbox, all undated tasks, overdue tasks, and the next 14 days. Include high-priority undated work. Preserve task/list IDs, links, recurring dates, all-day values, and time zones. State every failed, truncated, or unqueried scope; never present partial results as the complete account."
    blockedBy: []

  - id: compile-briefing
    type: agent
    title: Compile morning briefing
    agent: digest
    prompt: "Compile a concise morning briefing from the email summary and observed task workload. Include urgent emails, overdue/today tasks, high-priority undated work, and a prioritized action list. Include a visible TickTick coverage note whenever any list or query scope was failed, truncated, or unqueried."
    blockedBy:
      - fetch-emails
      - fetch-tasks

  - id: send-message
    type: notify
    title: Send briefing via Telegram
    channel: telegram
    message: "Morning briefing compiled — check the digest for today's priorities."
    blockedBy:
      - compile-briefing
