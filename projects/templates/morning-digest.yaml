name: morning-digest
displayName: Morning Digest
description: Compile and send the morning digest (tasks + emails)

plan:
  approval: auto
  parallel: true

tasks:
  - id: fetch-tasks
    type: agent
    title: Gather current TickTick workload
    agent: ticktick
    prompt: "Inspect the official TickTick schemas. Discover lists with list_projects, query each list with get_project_with_undone_tasks, and separately check Inbox, all undated tasks, overdue tasks, and the next 14 days. Include high-priority undated work. Preserve task/list IDs, links, recurring dates, all-day values, and time zones. State every failed, truncated, or unqueried scope; never present partial results as the complete account."
    blockedBy: []

  - id: fetch-emails
    type: agent
    title: Summarize recent emails
    agent: gmail
    prompt: "Summarize unread emails from the last 12 hours. Include sender, subject, and urgency (urgent/normal/low)."
    blockedBy: []

  - id: compile-digest
    type: agent
    title: Compile the digest
    agent: digest
    prompt: "Compile a concise morning digest from the gathered task and email results. Group urgent emails, overdue/today tasks, high-priority undated work, and a prioritized action list. Include a visible TickTick coverage note whenever any list or query scope was failed, truncated, or unqueried. Then send the compiled digest to the user via Telegram."
    blockedBy:
      - fetch-tasks
      - fetch-emails

  - id: send-digest
    type: notify
    title: Send digest via Telegram
    channel: telegram
    message: "Morning digest ready — check today's priorities."
    blockedBy:
      - compile-digest
